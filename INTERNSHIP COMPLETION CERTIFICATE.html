<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERNSHIP COMPLETION CERTIFICATE</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 21 — INTERNSHIP COMPLETION CERTIFICATE FORM</h1>
        <hr>
        <h2 align="center">Intern Details</h2>
        <hr width="30%">
        <br><br>
        <form action="internship_certificate.html">
            <label><b>Intern Full Name :- </b></label>
            <input type="text" placeholder="Intern's Full Name">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Gender :- </b></label>
            <input type="radio" value="Male" name="gender"> Male
            &nbsp;
            <input type="radio" value="Female" name="gender"> Female
            &nbsp;
            <input type="radio" value="Other" name="gender"> Other
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>College / University :- </b></label>
            <input type="text" placeholder="College / University Name">
            <br><br>
            <label><b>Course / Branch :- </b></label>
            <input type="text" placeholder="e.g. B.Tech CSE, BCA, MBA">
            <br><br>
            <hr width="30%">
            <h2 align="center">Internship Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Organization Name :- </b></label>
            <input type="text" placeholder="Company / Organization Name">
            <br><br>
            <label><b>Department / Team :- </b></label>
            <input type="text" placeholder="Department Interned In">
            <br><br>
            <label><b>Internship Domain :- </b></label>
            <select name="domain">
                <option value="Software">Software Development</option>
                <option value="DataScience">Data Science / AI</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Finance</option>
                <option value="HR">HR / Administration</option>
                <option value="Design">Design</option>
                <option value="Other">Other</option>
            </select>
            <br><br>
            <label><b>Start Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>End Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Mode of Internship :- </b></label>
            <input type="radio" value="Onsite" name="mode"> Onsite
            &nbsp;
            <input type="radio" value="Remote" name="mode"> Remote / WFH
            &nbsp;
            <input type="radio" value="Hybrid" name="mode"> Hybrid
            <br><br>
            <label><b>Mentor / Supervisor Name :- </b></label>
            <input type="text" placeholder="Supervisor / Manager Name">
            <br><br>
            <label><b>Project / Work Summary :- </b></label>
            <textarea rows="3" cols="40" placeholder="Brief description of work done during internship"></textarea>
            <br><br>
            <label><b>Upload Offer Letter :- </b></label>
            <input type="file">
            <br><br>
            <input type="submit" value="Submit Certificate Request">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>
            <hr>
           <p align="center">
            <a href="TRANSFER CERTIFICATE REQUEST.html">&larr; Previous Form</a>
            &nbsp;&nbsp;&nbsp;
            <b>[ FORM 21 of 23 ]</b>
            &nbsp;&nbsp;&nbsp;
            <a href="EXPERIENCE CERTIFICATE REQUEST.html">Next Form &rarr;</a>
           </p>
</body>
</html>
