<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPERIENCE CERTIFICATE REQUEST</title>
</head>
<body>
     <div>
        <h1 align="center">FORM 22 — EXPERIENCE CERTIFICATE REQUEST FORM</h1>
        <hr>
        <h2 align="center">Employee Details</h2>
        <hr width="30%">
        <br><br>
        <form action="experience_certificate.html">
            <label><b>Employee Full Name :- </b></label>
            <input type="text" placeholder="Employee Full Name">
            <br><br>
            <label><b>Employee ID :- </b></label>
            <input type="text" placeholder="Employee ID / Code">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Designation :- </b></label>
            <input type="text" placeholder="Last Held Designation">
            <br><br>
            <label><b>Department :- </b></label>
            <input type="text" placeholder="Department Name">
            <br><br>
            <label><b>Date of Joining :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Date of Relieving :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Reason for Leaving :- </b></label>
            <select name="reason">
                <option value="Resignation">Resignation</option>
                <option value="BetterOpportunity">Better Opportunity</option>
                <option value="HigherStudies">Higher Studies</option>
                <option value="Personal">Personal Reason</option>
                <option value="Contract">Contract Completion</option>
                <option value="Retirement">Retirement</option>
            </select>
            <br><br>
            <label><b>Employment Type :- </b></label>
            <select name="emptype">
                <option value="FullTime">Full Time</option>
                <option value="PartTime">Part Time</option>
                <option value="Contract">Contract / Consulting</option>
                <option value="Apprentice">Apprentice</option>
            </select>
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>Mailing Address :- </b></label>
            <textarea rows="3" cols="40" placeholder="Address to send the certificate (if postal)"></textarea>
            <br><br>
            <label><b>Certificate Required For :- </b></label>
            <select name="purpose">
                <option value="NewEmployment">New Employment</option>
                <option value="Visa">Visa Application</option>
                <option value="Bank">Bank / Loan Purpose</option>
                <option value="Personal">Personal Record</option>
                <option value="Other">Other</option>
            </select>
            <br><br>
            <label><b>Upload Resignation Letter :- </b></label>
            <input type="file">
            <br><br>
            <input type="submit" value="Submit Certificate Request">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>
            <hr>
           <p align="center">
            <a href="INTERNSHIP COMPLETION CERTIFICATE.html">&larr; Previous Form</a>
            &nbsp;&nbsp;&nbsp;
            <b>[ FORM 22 of 23 ]</b>
            &nbsp;&nbsp;&nbsp;
            <a href="DEGREE CERTIFICATE APPLICATION.html">Next Form &rarr;</a>
           </p>
</body>
</html>
