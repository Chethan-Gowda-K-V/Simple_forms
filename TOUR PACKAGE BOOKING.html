<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOUR PACKAGE BOOKING</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 15 — TOUR PACKAGE BOOKING FORM</h1>
        <hr>
        <h2 align="center">Traveller Details</h2>
        <hr width="30%">
        <br><br>
        <form action="tour_package.html">
            <label><b>Lead Traveller Name :- </b></label>
            <input type="text" placeholder="Primary Contact Name">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>No. of Adults :- </b></label>
            <input type="number" placeholder="No. of Adults" min="1">
            <br><br>
            <label><b>No. of Children :- </b></label>
            <input type="number" placeholder="No. of Children (below 12)" min="0">
            <br><br>
            <hr width="30%">
            <h2 align="center">Tour Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Tour Destination :- </b></label>
            <input type="text" placeholder="e.g. Kerala, Manali, Europe">
            <br><br>
            <label><b>Tour Package :- </b></label>
            <select name="package">
                <option value="Budget">Budget Package</option>
                <option value="Standard">Standard Package</option>
                <option value="Premium">Premium Package</option>
                <option value="Luxury">Luxury Package</option>
                <option value="Honeymoon">Honeymoon Special</option>
            </select>
            <br><br>
            <label><b>Tour Duration :- </b></label>
            <input type="text" placeholder="e.g. 5 Nights / 6 Days">
            <br><br>
            <label><b>Departure Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Departure City :- </b></label>
            <input type="text" placeholder="Your City">
            <br><br>
            <label><b>Hotel Preference :- </b></label>
            <select name="hotel">
                <option value="3star">3 Star</option>
                <option value="4star">4 Star</option>
                <option value="5star">5 Star</option>
                <option value="Homestay">Homestay</option>
            </select>
            <br><br>
            <label><b>Meal Preference :- </b></label>
            <input type="checkbox" name="meal" value="veg"> Vegetarian
            &nbsp;
            <input type="checkbox" name="meal" value="nonveg"> Non-Veg
        
            <br><br>
            <label><b>Special Requests :- </b></label>
            <textarea rows="3" cols="40" placeholder="Any special requirements or requests"></textarea>
            <br><br>
            <input type="submit" value="Book Tour Package">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
<br>

           </p>
</body>
</html>
