<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARRIAGE CERTIFICATE REGISTRATION FORM</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 2 — MARRIAGE CERTIFICATE REGISTRATION FORM</h1>
        <hr>
        <h2 align="center">Groom Details</h2>
        <hr width="30%">
        <br><br>
        <form action="form2_marriage_certificate.html">

            <label for="GroomName"><b>Groom Full Name :- </b></label>
            <input type="text" placeholder="Groom's Full Name">
            <br><br>

            <label for="GroomDOB"><b>Groom Date of Birth :- </b></label>
            <input type="date">
            <br><br>

            <label for="GroomFather"><b>Groom Father's Name :- </b></label>
            <input type="text" placeholder="Father's Name">
            <br><br>

            <label for="GroomNationality"><b>Groom Nationality :- </b></label>
            <input type="text" value="Indian">
            <br><br>

            <label for="GroomReligion"><b>Groom Religion :- </b></label>
            <select name="groomreligion">
                <option value="">-- Select --</option>
                <option value="Hindu">Hindu</option>
                <option value="Muslim">Muslim</option>
                <option value="Christian">Christian</option>
                <option value="Sikh">Sikh</option>
                <option value="Buddhist">Buddhist</option>
                <option value="Jain">Jain</option>
                <option value="Other">Other</option>
            </select>
            <br><br>

            <label for="GroomAddress"><b>Groom Address :- </b></label>
            <textarea rows="2" cols="40" placeholder="Current Residential Address"></textarea>
            <br><br>
            <hr width="30%">
            <h2 align="center">Bride Details</h2>
            <hr width="30%">
            <br>

            <label for="BrideName"><b>Bride Full Name :- </b></label>
            <input type="text" placeholder="Bride's Full Name">
            <br><br>

            <label for="BrideDOB"><b>Bride Date of Birth :- </b></label>
            <input type="date">
            <br><br>

            <label for="BrideFather"><b>Bride Father's Name :- </b></label>
            <input type="text" placeholder="Father's Name">
            <br><br>

            <label for="BrideNationality"><b>Bride Nationality :- </b></label>
            <input type="text" value="Indian">
            <br><br>

            <label for="BrideReligion"><b>Bride Religion :- </b></label>
            <select name="bridereligion">
                <option value="">-- Select --</option>
                <option value="Hindu">Hindu</option>
                <option value="Muslim">Muslim</option>
                <option value="Christian">Christian</option>
                <option value="Sikh">Sikh</option>
                <option value="Buddhist">Buddhist</option>
                <option value="Jain">Jain</option>
                <option value="Other">Other</option>
            </select>
            <br><br>

            <label for="BrideAddress"><b>Bride Address :- </b></label>
            <textarea rows="2" cols="40" placeholder="Current Residential Address"></textarea>
            <br><br>
            <hr width="30%">
            <h2 align="center">Marriage Details</h2>
            <hr width="30%">
            <br>

            <label for="MarriageDate"><b>Date of Marriage :- </b></label>
            <input type="date">
            <br><br>

            <label for="MarriagePlace"><b>Place of Marriage :- </b></label>
            <input type="text" placeholder="Venue Name, City">
            <br><br>

            <label for="MarriageAct"><b>Act of Marriage :- </b></label>
            <select name="marriageact">
                <option value="Hindu">Hindu Marriage Act</option>
                <option value="Special">Special Marriage Act</option>
                <option value="Muslim">Muslim Personal Law</option>
                <option value="Christian">Christian Marriage Act</option>
            </select>
            <br><br>

            <label for="Witness1"><b>Witness 1 Name :- </b></label>
            <input type="text" placeholder="Full Name of Witness 1">
            <br><br>

            <label for="Witness2"><b>Witness 2 Name :- </b></label>
            <input type="text" placeholder="Full Name of Witness 2">
            <br><br>

            <label for="MarriagePhoto"><b>Upload Marriage Photo :- </b></label>
            <input type="file" accept="image/*">
            <br><br>

            <label for="IDProof"><b>Upload ID Proof :- </b></label>
            <input type="file">
            <br><br>

            <input type="checkbox" name="declaration">
            <b>I hereby declare that all the above information is true and correct.</b>
            <br><br>

            <input type="submit" value="Submit Application">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">

        </form>

        <br><br>
        <hr>
        <p align="center">
            <a href="BUS PASS.html">&larr; Previous Form</a>
            &nbsp;&nbsp;&nbsp;
            <b>[ FORM 2 of 23 ]</b>
            &nbsp;&nbsp;&nbsp;
            <a href="BIRTH CERTIFICATE.html">Next Form &rarr;</a>
        </p>
    </div>
</body>
</html>
