<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VACCINATION REGISTRATION</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 13 — VACCINATION REGISTRATION FORM</h1>
        <hr>
        <h2 align="center">Beneficiary Details</h2>
        <hr width="30%">
        <br><br>
        <form action="vaccination.html">
            <label><b>Full Name :- </b></label>
            <input type="text" placeholder="Beneficiary Full Name">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Gender :- </b></label>
            <input type="radio" value="Male" name="gender"> Male
            &nbsp;
            <input type="radio" value="Female" name="gender"> Female
            &nbsp;
            <input type="radio" value="Other" name="gender"> Other
            <br><br>
            <label><b>Aadhaar Number :- </b></label>
            <input type="text" placeholder="12-digit Aadhaar" maxlength="12">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
           <hr width="30%">
            <h2 align="center">Vaccination Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Vaccine Name :- </b></label>
            <select name="vaccine">
                <option value="">-- Select Vaccine --</option>
                <option value="Covishield">COVID-19 (Covishield)</option>
                <option value="Covaxin">COVID-19 (Covaxin)</option>
                <option value="Influenza">Influenza</option>
                <option value="HepB">Hepatitis B</option>
                <option value="TT">Tetanus (TT)</option>
                <option value="BCG">BCG</option>
                <option value="MMR">MMR</option>
            </select>
            <br><br>
            <label><b>Dose Number :- </b></label>
            <input type="radio" value="1st" name="dose"> 1st Dose
            &nbsp;
            <input type="radio" value="2nd" name="dose"> 2nd Dose
            &nbsp;
            <input type="radio" value="Booster" name="dose"> Booster
            <br><br>
            <label><b>Preferred Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Preferred Vaccination Centre :- </b></label>
            <input type="text" placeholder="Hospital / PHC Name and City">
            <br><br>
            <label><b>Any Allergies? :- </b></label>
            <input type="text" placeholder="Mention any known allergies (or None)">
            <br><br>
            <label><b>Medical Conditions :- </b></label>
            <textarea rows="2" cols="40" placeholder="Existing medical conditions if any"></textarea>
            <br><br>
            <input type="submit" value="Register for Vaccination">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>

            &nbsp;&nbsp;&nbsp;

            &nbsp;&nbsp;&nbsp;

           </p>
</body>
</html>
