<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOAN APPLICATION</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 9 — LOAN APPLICATION FORM</h1>
        <hr>
        <h2 align="center">Applicant Details</h2>
        <hr width="30%">
        <br><br>
        <form action="loan_application.html">
            <label><b>Full Name :- </b></label>
            <input type="text" placeholder="Applicant's Full Name">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>PAN Number :- </b></label>
            <input type="text" placeholder="XXXXXXXXXX" maxlength="10">
            <br><br>
            <label><b>CIBIL Score :- </b></label>
            <input type="number" placeholder="300 to 900" min="300" max="900">
            <br><br>
            <label><b>Occupation :- </b></label>
            <select name="occupation">
                <option value="Salaried">Salaried</option>
                <option value="SelfEmployed">Self Employed</option>
                <option value="Business">Business Owner</option>
                <option value="Professional">Professional</option>
            </select>
            <br><br>
            <label><b>Monthly Income (Rs.) :- </b></label>
            <input type="number" placeholder="Gross Monthly Income">
            <br><br>
            <label><b>Employer / Company :- </b></label>
            <input type="text" placeholder="Employer / Company Name">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>Residential Address :- </b></label>
            <textarea rows="3" cols="40" placeholder="Complete Address"></textarea>
            <br><br>
            <hr width="30%">
            <h2 align="center">Loan Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Loan Type :- </b></label>
            <select name="loantype">
                <option value="Home">Home Loan</option>
                <option value="Personal">Personal Loan</option>
                <option value="Car">Car / Auto Loan</option>
                <option value="Education">Education Loan</option>
                <option value="Business">Business Loan</option>
                <option value="Gold">Gold Loan</option>
            </select>
            <br><br>
            <label><b>Loan Amount (Rs.) :- </b></label>
            <input type="number" placeholder="Requested Loan Amount">
            <br><br>
            <label><b>Loan Tenure (Months) :- </b></label>
            <input type="number" placeholder="No. of Months">
            <br><br>
            <label><b>Purpose of Loan :- </b></label>
            <textarea rows="2" cols="40" placeholder="Briefly describe the purpose"></textarea>
            <br><br>
            <label><b>Co-Applicant Name :- </b></label>
            <input type="text" placeholder="Co-Applicant Full Name (if any)">
            <br><br>
            <label><b>Upload Salary Slips :- </b></label>
            <input type="file">
            <br><br>
            <label><b>Upload Bank Statement :- </b></label>
            <input type="file">
            <br><br>
            <input type="submit" value="Submit Application">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>
            <hr>

            <a href="BANK ACCOUNT OPENING.html">&larr; Previous Form</a>
            &nbsp;&nbsp;&nbsp;

            &nbsp;&nbsp;&nbsp;

           </p>
</body>
</html>
