<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLINE PRODUCT FEEDBACK FORM</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 18 — ONLINE PRODUCT FEEDBACK FORM</h1>
        <hr>
        <h2 align="center">Customer Details</h2>
        <hr width="30%">
        <br><br>
        <form action="product_feedback.html">
            <label><b>Customer Name :- </b></label>
            <input type="text" placeholder="Your Name">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Customer Type :- </b></label>
            <input type="radio" value="New" name="custtype"> New Customer
            &nbsp;
            <input type="radio" value="Existing" name="custtype"> Existing Customer
            <br><br>
            <hr width="30%">
            <h2 align="center">Product Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Product Name :- </b></label>
            <input type="text" placeholder="Product Name / Model">
            <br><br>
            <label><b>Order Number :- </b></label>
            <input type="text" placeholder="Order ID / Invoice Number">
            <br><br>
            <label><b>Purchase Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Purchase Channel :- </b></label>
            <select name="channel">
                <option value="OnlineStore">Online Store</option>
                <option value="Amazon">Amazon</option>
                <option value="Flipkart">Flipkart</option>
                <option value="Offline">Offline / Retail Store</option>
                <option value="Other">Other</option>
            </select>
            <br><br>
            <hr width="30%">
            <h2 align="center">Rating and Feedback</h2>
            <hr width="30%">
            <br><br>

            <label><b>Overall Rating :- </b></label>
            <input type="radio" value="5" name="rating"> Excellent (5)
            &nbsp;
            <input type="radio" value="4" name="rating"> Good (4)
            &nbsp;
            <input type="radio" value="3" name="rating"> Average (3)
            &nbsp;
            <input type="radio" value="2" name="rating"> Poor (2)
            &nbsp;
            <input type="radio" value="1" name="rating"> Very Poor (1)
            <br><br>
            <label><b>Quality :- </b></label>
            <select name="quality">
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Average">Average</option>
                <option value="Poor">Poor</option>
            </select>
            <br><br>
            <label><b>Value for Money :- </b></label>
            <select name="value">
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Average">Average</option>
                <option value="Poor">Poor</option>
            </select>
            <br><br>
            <label><b>Would you Recommend? :- </b></label>
            <input type="radio" value="Yes" name="recommend"> Yes
            &nbsp;
            <input type="radio" value="No" name="recommend"> No
            <br><br>
            <label><b>Comments / Suggestions :- </b></label>
            <textarea rows="4" cols="40" placeholder="Your detailed feedback and suggestions..."></textarea>
            <br><br>
            <input type="submit" value="Submit Feedback">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
<br>

</body>
</html>
