<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAVE APPLICATION</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 11 — LEAVE APPLICATION FORM</h1>
        <hr>
        <h2 align="center">Employee Details</h2>
        <hr width="30%">
        <br><br>
        <form action="leave_application.html">
            <label><b>Employee Name :- </b></label>
            <input type="text" placeholder="Full Name">
            <br><br>
            <label><b>Employee ID :- </b></label>
            <input type="text" placeholder="Employee ID / Code">
            <br><br>
            <label><b>Department :- </b></label>
            <input type="text" placeholder="Department Name">
            <br><br>
            <label><b>Designation :- </b></label>
            <input type="text" placeholder="Job Title / Designation">
            <br><br>
            <label><b>Manager / HOD Name :- </b></label>
            <input type="text" placeholder="Reporting Manager's Name">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <hr width="30%">
            <h2 align="center">Leave Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Type of Leave :- </b></label>
            <select name="leavetype">
                <option value="CL">Casual Leave (CL)</option>
                <option value="SL">Sick Leave (SL)</option>
                <option value="EL">Earned Leave (EL)</option>
                <option value="ML">Maternity Leave</option>
                <option value="PL">Paternity Leave</option>
                <option value="Comp">Compensatory Leave</option>
            </select>
            <br><br>
            <label><b>From Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>To Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>No. of Days :- </b></label>
            <input type="number" placeholder="Total Days">
            <br><br>
            <label><b>Reason for Leave :- </b></label>
            <textarea rows="4" cols="40" placeholder="Provide detailed reason for leave request"></textarea>
            <br><br>
            <label><b>Emergency Contact :- </b></label>
            <input type="tel" placeholder="Contact during leave">
            <br><br>
            <label><b>Work Handover To :- </b></label>
            <input type="text" placeholder="Colleague handling work during leave">
            <br><br>
            <label><b>Supporting Document :- </b></label>
            <input type="file">
            <br><br>
            <input type="submit" value="Submit Application">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>

           </p>
</body>
</html>
