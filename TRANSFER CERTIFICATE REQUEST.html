<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFER CERTIFICATE REQUEST</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 20 — TRANSFER CERTIFICATE REQUEST FORM</h1>
        <hr>
        <h2 align="center">Student Details</h2>
        <hr width="30%">
        <br><br>
        <form action="transfer_certificate.html">
            <label><b>Student Name :- </b></label>
            <input type="text" placeholder="Student Full Name">
            <br><br>
            <label><b>Roll Number :- </b></label>
            <input type="text" placeholder="Roll / Register Number">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Gender :- </b></label>
            <input type="radio" value="Male" name="gender"> Male
            &nbsp;
            <input type="radio" value="Female" name="gender"> Female
            &nbsp;
            <input type="radio" value="Other" name="gender"> Other
            <br><br>
            <label><b>Current Class / Year :- </b></label>
            <input type="text" placeholder="e.g. Class 10 / 3rd Year B.Sc.">
            <br><br>
            <label><b>Section :- </b></label>
            <input type="text" placeholder="Section A / B / C">
            <br><br>
            <label><b>Father's Name :- </b></label>
            <input type="text" placeholder="Father's Full Name">
            <br><br>
            <label><b>Mother's Name :- </b></label>
            <input type="text" placeholder="Mother's Full Name">
            <br><br>
            <label><b>Date of Admission :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Reason for Transfer :- </b></label>
            <textarea rows="3" cols="40" placeholder="State reason for requesting TC"></textarea>
            <br><br>
            <label><b>New Institution Name :- </b></label>
            <input type="text" placeholder="Name of New School / College (if known)">
            <br><br>
            <label><b>Date of Leaving :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Pending Dues Cleared? :- </b></label>
            <input type="radio" value="Yes" name="dues"> Yes, All Dues Cleared
            &nbsp;
            <input type="radio" value="No" name="dues"> No
            <br><br>
            <input type="submit" value="Submit TC Request">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
<br>

           </p>
</body>
</html>
