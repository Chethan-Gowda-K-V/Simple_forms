<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUSTOMER COMPLAINT REGISTRATION</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 19 — CUSTOMER COMPLAINT REGISTRATION FORM</h1>
        <hr>
        <h2 align="center">Complainant Details</h2>
        <hr width="30%">
        <br><br>
        <form action="customer_complaint.html">
            <label><b>Full Name :- </b></label>
            <input type="text" placeholder="Complainant Full Name">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>Address :- </b></label>
            <textarea rows="2" cols="40" placeholder="Complainant Address"></textarea>
            <br><br>
            <hr width="30%">
            <h2 align="center">Complaint Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Complaint Category :- </b></label>
            <select name="category">
                <option value="">-- Select Category --</option>
                <option value="Quality">Product Quality</option>
                <option value="Delivery">Delivery Issue</option>
                <option value="Billing">Billing / Payment</option>
                <option value="Service">Customer Service</option>
                <option value="Technical">Technical Problem</option>
                <option value="Defective">Defective Product</option>
                <option value="Fraud">Fraud / Cheating</option>
                <option value="Other">Other</option>
            </select>
            <br><br>
            <label><b>Order / Reference No. :- </b></label>
            <input type="text" placeholder="Order / Transaction Reference No.">
            <br><br>
            <label><b>Date of Incident :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Complaint Subject :- </b></label>
            <input type="text" placeholder="Brief Subject of Complaint">
            <br><br>
            <label><b>Detailed Description :- </b></label>
            <textarea rows="5" cols="40" placeholder="Please describe your complaint in detail..."></textarea>
            <br><br>
            <label><b>Expected Resolution :- </b></label>
            <select name="resolution">
                <option value="Refund">Refund</option>
                <option value="Replacement">Replacement</option>
                <option value="Repair">Repair</option>
                <option value="Apology">Apology</option>
                <option value="Investigation">Investigation</option>
                <option value="Other">Other</option>
            </select>
            <br><br>
            <label><b>Priority :- </b></label>
            <input type="radio" value="High" name="priority"> High (Urgent)
            &nbsp;
            <input type="radio" value="Medium" name="priority"> Medium
            &nbsp;
            <input type="radio" value="Low" name="priority"> Low
            <br><br>
            <label><b>Upload Evidence :- </b></label>
            <input type="file" multiple>
            <br><br>
            <input type="submit" value="Lodge Complaint">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>
            <hr>

            &nbsp;&nbsp;&nbsp;

            &nbsp;&nbsp;&nbsp;

           </p>
</body>
</html>
