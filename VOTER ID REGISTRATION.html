<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOTER ID REGISTRATION</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 6 — VOTER ID REGISTRATION FORM</h1>
        <hr>
        <h2 align="center">Applicant Details</h2>
        <hr width="30%">
        <br><br>
        <form action="voter_id.html">
            <label><b>Full Name :- </b></label>
            <input type="text" placeholder="Name as per Aadhaar / DOB Proof">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Age :- </b></label>
            <input type="number" placeholder="Age (Min 18)">
            <br><br>
            <label><b>Gender :- </b></label>
            <input type="radio" value="Male" name="gender"> Male
            &nbsp;
            <input type="radio" value="Female" name="gender"> Female
            &nbsp;
            <input type="radio" value="Other" name="gender"> Other
            <br><br>
            <label><b>Father / Husband Name :- </b></label>
            <input type="text" placeholder="Father's or Husband's Full Name">
            <br><br>
            <label><b>Nationality :- </b></label>
            <input type="text" value="Indian">
            <br><br>
            <label><b>Aadhaar Number :- </b></label>
            <input type="text" placeholder="12-digit Aadhaar Number" maxlength="12">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <hr width="30%">
            <h2 align="center">Address Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>House No / Name :- </b></label>
            <input type="text" placeholder="House Number / Name">
            <br><br>
            <label><b>Street / Ward :- </b></label>
            <input type="text" placeholder="Street / Ward Name">
            <br><br>
            <label><b>Village / Town :- </b></label>
            <input type="text" placeholder="Village / Town Name">
            <br><br>
            <label><b>Tehsil / Taluk :- </b></label>
            <input type="text" placeholder="Tehsil / Taluk">
            <br><br>
            <label><b>District :- </b></label>
            <input type="text" placeholder="District Name">
            <br><br>
            <label><b>State :- </b></label>
            <input type="text" placeholder="State Name">
            <br><br>
            <label><b>PIN Code :- </b></label>
            <input type="text" placeholder="6-digit PIN Code" maxlength="6">
            <br><br>
            <label><b>Assembly Constituency :- </b></label>
            <input type="text" placeholder="Constituency Name">
            <br><br>
            <label><b>Upload Photo :- </b></label>
            <input type="file" accept="image/*">
            <br><br>
            <label><b>Upload Age Proof :- </b></label>
            <input type="file">
            <br><br>
            <label><b>Upload Address Proof :- </b></label>
            <input type="file">
            <br><br>
            <input type="submit" value="Submit Application">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>

            &nbsp;&nbsp;&nbsp;

           </p>
</body>
</html>
