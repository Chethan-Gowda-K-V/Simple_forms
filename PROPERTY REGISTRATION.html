<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROPERTY REGISTRATION</title>
</head>

<body>
    <div>
        <h1 align="center">FORM 4 — PROPERTY REGISTRATION FORM</h1>
        <hr>
        <h2 align="center"> Seller / Owner Details</h2>
        <hr width="30%">
        <br>
        <div>
            <form action="PROPERTY REGISTRATION.html">
                <label for="Full Name"><b>Seller Name :- </b></label>
                <input type="text" placeholder="Legal Name of Seller">
                <br><br>

                <label for="Aadhaar Number"><b>Aadhaar Number :- </b></label>
                <input type="Number" maxlength="12" placeholder="12 digit Aadhar Nuber">
                <br><br>
                <label for="number"><b>Pan Number :- </b></label>
                <input type="number" maxlength="10" placeholder="xxxxxxxxxx">
                <br><br>

                <label for="Address"><b> Seller Address:- </b></label>&nbsp;&nbsp;

                <textarea placeholder="Current Address"></textarea>


            </form>
            <br>
        </div>
        <hr width="30%">
        <h2 align="center"> Buyer Details</h2>
        <hr width="30%">
        <br>
        <div>
            <form action="PROPERTY REGISTRATION.html">
                <label for="Full Name"><b>Buyer Name :- </b></label>
                <input type="text" placeholder="Legal Name of Buyer">
                <br><br>

                <label for="Aadhaar Number"><b>Aadhaar Number :- </b></label>
                <input type="Number" maxlength="12" placeholder="12 digit Aadhar Nuber">
                <br><br>
                <label for="number"><b>Pan Number :- </b></label>
                <input type="number" maxlength="10" placeholder="xxxxxxxxxx">
                <br><br>

                <label for="number"><b> Buyer Mobile No :- </b></label>&nbsp;&nbsp;

                <input type="number" placeholder="+91 xxxxxxxxxx">


            </form>
            <hr width="30%">
            <h2 align="center"> Property Details</h2>
            <hr width="30%">
            <br>
            <label for=""><b>Property Type</b></label>
            <select>
                <option value="Residential Plot">Residential Plot</option>
                <option value="Agricultural Land">Agricultural Land</option>
                <option value="Commercial Building">Commercial Building</option>
                <option value="Apartment/Flat">Apartment/Flat</option>
            </select>
            <br><br>
            <label for=""><b>Servey Number</b></label>
            <input type="text" placeholder="Survey/Khata Number"><br><br>
            <label for="Address"><b> Property Address:- </b></label>&nbsp;&nbsp;
            <textarea placeholder="Complete Address with Dist ,Taluk,village"></textarea>
            <br><br>
            <label for="number"><b>Area (in sq.ft) :- </b></label>
            <input type="number" maxlength="10" placeholder="Area in Sqr.Ft">
            <br><br>
            <label for="number"><b>Sale Value (Rs.) :- </b></label>
            <input type="number" maxlength="10" placeholder="Transaction">

            <br><br>
            <label for="DOB"><b>Date of Transaction : :- </b></label>
            <input type="date">
            <br><br>
            <label for="Picture"><b>Upload Title Deed :-</b></label>
            <input type="file">
            <br><br>
            <label for="Picture"><b>Upload Encumbrance Cert :-</b></label>
            <input type="file">
            <br><br>
            <button style="color: green;">Submit</button>&nbsp;&nbsp;
            <button style="color: crimson;">Clear</button>
            <br>
            <hr>
           <p align="center">
            <a href="BIRTH CERTIFICATE.html">&larr; Previous Form</a>
            &nbsp;&nbsp;&nbsp;
            <b>[ FORM 4 of 23 ]</b>
            &nbsp;&nbsp;&nbsp;
            <a href="PASSPORT APPLICATION.html">Next Form &rarr;</a>
           </p>


</body>

</html>
