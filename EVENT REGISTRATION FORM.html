<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT REGISTRATION FORM</title>
</head>
<body>
    <div>
        <h1 align="center">FORM 17 — EVENT REGISTRATION FORM</h1>
        <hr>
        <h2 align="center">Participant Details</h2>
        <hr width="30%">
        <br><br>
        <form action="event_registration.html">
            <label><b>Full Name :- </b></label>
            <input type="text" placeholder="Your Full Name">
            <br><br>
            <label><b>Date of Birth :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Gender :- </b></label>
            <input type="radio" value="Male" name="gender"> Male
            &nbsp;
            <input type="radio" value="Female" name="gender"> Female
            &nbsp;
            <input type="radio" value="Other" name="gender"> Other
            <br><br>
            <label><b>Email Address :- </b></label>
            <input type="email" placeholder="email@example.com">
            <br><br>
            <label><b>Mobile Number :- </b></label>
            <input type="tel" placeholder="+91 XXXXXXXXXX">
            <br><br>
            <label><b>Organization / Institution :- </b></label>
            <input type="text" placeholder="Company / College / School Name">
            <br><br>
            <hr width="30%">
            <h2 align="center">Event Details</h2>
            <hr width="30%">
            <br><br>

            <label><b>Event Name :- </b></label>
            <input type="text" placeholder="Name of the Event">
            <br><br>
            <label><b>Event Date :- </b></label>
            <input type="date">
            <br><br>
            <label><b>Event Category :- </b></label>
            <select name="category">
                <option value="Technical">Technical / IT</option>
                <option value="Cultural">Cultural / Arts</option>
                <option value="Sports">Sports</option>
                <option value="Business">Business Conference</option>
                <option value="Workshop">Workshop / Seminar</option>
                <option value="Government">Government Event</option>
            </select>
            <br><br>
            <label><b>Participation Mode :- </b></label>
            <input type="radio" value="Online" name="mode"> Online
            &nbsp;
            <input type="radio" value="Offline" name="mode"> Offline
            &nbsp;
            <input type="radio" value="Hybrid" name="mode"> Hybrid
            <br><br>
            <label><b>T-Shirt Size :- </b></label>
            <select name="tshirt">
                <option value="NA">Not Required</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
            </select>
            <br><br>
            <label><b>Dietary Preference :- </b></label>
            <input type="radio" value="Veg" name="diet"> Vegetarian
            &nbsp;
            <input type="radio" value="NonVeg" name="diet"> Non-Vegetarian
            <br><br>
            <label><b>How did you hear about us? :- </b></label>
            <select name="source">
                <option value="SocialMedia">Social Media</option>
                <option value="Notice">College Notice Board</option>
                <option value="Friend">Friend / Colleague</option>
                <option value="Email">Email Newsletter</option>
                <option value="Website">Website</option>
            </select>
            <br><br>
            <input type="submit" value="Register for Event">
            &nbsp;&nbsp;
            <input type="reset" value="Clear Form">
        </form>
    </div>
    <br>

</body>
</html>
